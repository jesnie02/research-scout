[project]
name = "research-scout"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai==3.39.0",
    "pydantic-ai-slim[cohere,openai]==2.61.0",
    "requests>=2.34",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-requests>=2.33.0.20261030",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=scout --cov-report=term-missing"

[tool.coverage.report]
fail_under = 95

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["scout", "scripts", "eval", "tests", "main.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
